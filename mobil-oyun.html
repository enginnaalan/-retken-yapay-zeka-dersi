<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Better Slither Clone</title>
<style>
body{margin:0;overflow:hidden;background:#0b0b0b;font-family:Arial;color:white}
canvas{display:block;background:radial-gradient(circle,#1d1d1d,#080808)}
#score{position:absolute;top:20px;left:20px;font-size:24px}
#msg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:40px;display:none;text-align:center}
</style>
</head>
<body>
<div id="score">Skor: 0</div>
<div id="msg">ÖLDÜN<br>Sayfayı yenile</div>
<canvas id="game"></canvas>
<script>
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
canvas.width=innerWidth; canvas.height=innerHeight;

let mouse={x:400,y:300}, boosting=false, score=0, alive=true;
const player={body:[{x:400,y:300}],color:'cyan'};
const bots=[], foods=[];

for(let i=0;i<120;i++)spawnFood();
for(let i=0;i<8;i++)spawnBot();
for(let i=0;i<25;i++)grow(player);

document.addEventListener('mousemove',e=>mouse={x:e.clientX,y:e.clientY});
document.addEventListener('keydown',e=>{if(e.code==='Space')boosting=true});
document.addEventListener('keyup',e=>{if(e.code==='Space')boosting=false});

function spawnFood(){foods.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,color:`hsl(${Math.random()*360},100%,50%)`})}

function grow(s){s.body.push({...s.body[s.body.length-1]})}

function spawnBot(){
let b={body:[{x:Math.random()*canvas.width,y:Math.random()*canvas.height}],angle:Math.random()*6.28,color:`hsl(${Math.random()*360},100%,50%)`};
for(let i=0;i<20;i++)grow(b);
bots.push(b);
}

function moveSnake(s,target,speed){
 let h={...s.body[0]};
 let a=Math.atan2(target.y-h.y,target.x-h.x);
 h.x+=Math.cos(a)*speed;
 h.y+=Math.sin(a)*speed;
 s.body.unshift(h); s.body.pop();
}

function createFoodFromSnake(snake){
 snake.body.forEach(seg=>foods.push({x:seg.x,y:seg.y,color:snake.color}));
}

function killSnake(arr,index){
 let dead=arr[index];
 createFoodFromSnake(dead);
 arr.splice(index,1);
}

function die(){
 alive=false;
 document.getElementById('msg').style.display='block';
}

function checkCollision(){
 // player vs bot body (player dies)
 for(let bot of bots){
   for(let seg of bot.body){
     if(Math.hypot(player.body[0].x-seg.x,player.body[0].y-seg.y)<10){
       die();
       return;
     }
   }
 }

 // bot head vs player body (bot dies)
 for(let i=bots.length-1;i>=0;i--){
   let bot=bots[i];
   for(let seg of player.body){
     if(Math.hypot(bot.body[0].x-seg.x,bot.body[0].y-seg.y)<10){
       killSnake(bots,i);
       score+=5;
       scoreUI();
       break;
     }
   }
 }
}

function update(){
 if(!alive) return;

 moveSnake(player,mouse,boosting?6:3);

 bots.forEach(bot=>{
   bot.angle+=(Math.random()-0.5)*0.25;
   moveSnake(bot,{x:bot.body[0].x+Math.cos(bot.angle)*100,y:bot.body[0].y+Math.sin(bot.angle)*100},2.4);
 });

 foods.forEach((f,i)=>{
   if(Math.hypot(player.body[0].x-f.x,player.body[0].y-f.y)<18){foods.splice(i,1);spawnFood();grow(player);score++;scoreUI()}
   bots.forEach(bot=>{if(Math.hypot(bot.body[0].x-f.x,bot.body[0].y-f.y)<18){foods.splice(i,1);spawnFood();grow(bot)}})
 });

 checkCollision();
}

function scoreUI(){document.getElementById('score').innerText='Skor: '+score}

function drawEyes(head,next){
 let angle=Math.atan2(head.y-next.y,head.x-next.x);
 let ox=Math.cos(angle+Math.PI/2)*5;
 let oy=Math.sin(angle+Math.PI/2)*5;
 ctx.fillStyle='white';
 ctx.beginPath();ctx.arc(head.x+ox,head.y+oy,3,0,6.28);ctx.arc(head.x-ox,head.y-oy,3,0,6.28);ctx.fill();
 ctx.fillStyle='black';
 ctx.beginPath();ctx.arc(head.x+ox,head.y+oy,1.5,0,6.28);ctx.arc(head.x-ox,head.y-oy,1.5,0,6.28);ctx.fill();
}

function drawSnake(s){
 s.body.forEach((seg,i)=>{
   ctx.fillStyle=s.color;
   ctx.beginPath();
   ctx.arc(seg.x,seg.y,Math.max(5,13-i*0.12),0,6.28);
   ctx.fill();
 });
 if(s.body[1]) drawEyes(s.body[0],s.body[1]);
}

function draw(){
 ctx.clearRect(0,0,canvas.width,canvas.height);
 foods.forEach(f=>{ctx.fillStyle=f.color;ctx.beginPath();ctx.arc(f.x,f.y,5,0,6.28);ctx.fill()});
 drawSnake(player);
 bots.forEach(drawSnake);
}

function loop(){update();draw();requestAnimationFrame(loop)}
loop();
</script>
</body>
</html>
